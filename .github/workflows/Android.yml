name: Build Android APK

on:
  workflow_dispatch:

jobs:
  buildAndroid:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Set up Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: '4.3.4'

      - name: Set up Haxelib
        run: |
          haxelib setup ~/haxelib

      - name: Install Psych Engine libraries
        run: |
          chmod +x setup/unix.sh
          ./setup/unix.sh

      - name: Install Android libraries
        run: |
          haxelib git extension-androidtools https://github.com/jigsaw-4277821/extension-androidtools.git

          haxelib remove linc_luajit || true
          haxelib git linc_luajit https://github.com/jigsaw-4277821/linc_luajit.git

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-30"
          sdkmanager "build-tools;30.0.3"
          sdkmanager "ndk;21.4.7075529"

      - name: Configure Android environment
        run: |
          echo "ANDROID_SDK=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/21.4.7075529" >> $GITHUB_ENV
          echo "JAVA_HOME=$JAVA_HOME" >> $GITHUB_ENV

      - name: Set up Lime for Android
        run: |
          haxelib run lime setup android

      - name: Build Android APK
        run: |
          haxelib run lime build Project.xml android -release -D officialBuild

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PsychEngine-Android
          path: |
            export/release/android/bin/**/*.apk
          if-no-files-found: error